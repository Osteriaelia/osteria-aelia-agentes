# Sube los agentes a la cuenta de Claude y carga la memoria de partida.
# Se lanza a mano desde la pestaña Actions: pulsar "Run workflow" es la aprobación de JOSU.
name: Preparar agentes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la clave de Claude
        env:
          CLAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Quita espacios y saltos de línea que se cuelan al copiar y pegar.
          CLAVE="$(printf '%s' "$CLAVE" | tr -d '[:space:]')"
          echo "::add-mask::$CLAVE"
          if [ -z "$CLAVE" ]; then
            echo "::error::El secreto ANTHROPIC_API_KEY está vacío o no existe."
            exit 1
          fi
          # Los primeros 13 caracteres solo dicen el tipo de clave (no son secretos).
          echo "Tipo de clave: ${CLAVE:0:13}... (${#CLAVE} caracteres)"
          case "$CLAVE" in
            sk-ant-admin*) echo "::error::Es una clave de administración (Admin key). Hace falta una API key normal: console.anthropic.com > API Keys > Create Key."
               exit 1 ;;
            sk-ant-*) ;;
            *) echo "::error::No parece una clave de Claude: debe empezar por sk-ant-. Copia la API key de console.anthropic.com > API Keys."
               exit 1 ;;
          esac
          echo "ANTHROPIC_API_KEY=$CLAVE" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Instalar ant
        run: go install github.com/anthropics/anthropic-cli/cmd/ant@latest

      - name: Plan
        run: ant apply --dry-run -v agents/direccion/agent.md agents/direccion/environment.yaml agents/direccion/memory_store-aelia.yaml

      - name: Subir agentes, entorno y memoria
        run: ant apply --yes agents/direccion/agent.md agents/direccion/environment.yaml agents/direccion/memory_store-aelia.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cargar la memoria de partida
        run: |
          pip install -r bot/requirements.txt
          python bot/cargar_memoria.py

      - name: Guardar claude-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude-lock.json
          git diff --cached --quiet || git commit -m "Actualiza claude-lock.json"
          git push
